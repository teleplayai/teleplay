name: Idea
description: Suggest something for Teleplay
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue, please. Please don't include personal information.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Teleplay to do, and why would it help you?
    validations:
      required: true
